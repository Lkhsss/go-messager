name: Build Docker

run-name: 构建 Docker 镜像 · ${{ github.ref_name }}

# 推送 vX.Y.Z 形式的标签时发布镜像；也可以在 Actions 页面手动触发
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# 同一个分支/标签的构建串行执行，避免并发推送同一个镜像标签
concurrency:
  group: build-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # 默认推送到 GitHub Container Registry。
  # 使用其他仓库（Docker Hub / Gitea / 阿里云 ACR 等）时，在
  # 「仓库 → Settings → Variables」中覆盖下面三个变量，并在 Secrets 中添加
  # REGISTRY_PASSWORD（不配置时依次回退到 GITEA_TOKEN / GITHUB_TOKEN）。
  #   Docker Hub 示例：
  #     REGISTRY=docker.io
  #     IMAGE_NAME=docker.io/<用户名>/go-messager
  #     REGISTRY_USERNAME=<用户名>
  #   Gitea 示例：
  #     REGISTRY=git.lkhssssss.cn
  #     IMAGE_NAME=git.lkhssssss.cn/lkhsss/go-messager
  #     REGISTRY_USERNAME=lkhsss
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}
  REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME || github.actor }}
  # 多架构平台；只构建 amd64 可设为 linux/amd64
  # PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64' }}

jobs:
  test:
    name: 测试与前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 校验版本号
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::标签 ${tag} 不是 vX.Y.Z 形式的语义化版本"
            exit 1
          fi

      - name: 安装 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 pnpm 和 Node.js
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@24
          working-directory: template
          cache: true
          cache-dependency-path: template/pnpm-lock.yaml
          install: false

      - name: 安装前端依赖
        working-directory: template
        run: pnpm install --frozen-lockfile

      - name: 构建前端（含类型检查）
        working-directory: template
        run: pnpm run build

      - name: 运行 Go 测试
        run: go test ./...

  docker:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 设置 QEMU（多架构构建）
        uses: docker/setup-qemu-action@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=go-messager
            org.opencontainers.image.description=Go 语言论坛
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          # 部分自建 registry 不支持 OCI attestation，关闭 provenance 以保证兼容
          provenance: false
          # 用镜像仓库保存 BuildKit 缓存，GitHub / Gitea / Docker Hub 都可用
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
