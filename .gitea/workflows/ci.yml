name: CI TEST

run-name: CI测试 · ${{ gitea.sha }}

on: [push, workflow_dispatch]

jobs:
  frontend:
    name: 前端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 pnpm 和 Node.js
        uses: pnpm/setup@v3
        env:
          npm_config_registry: https://registry.npmmirror.com
          pnpm_config_registry: https://registry.npmmirror.com
        with:
          registry: https://registry.npmmirror.com
          # version: 11
          runtime: node@26
          working-directory: template
          cache-dependency-path: template/pnpm-lock.yaml
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile # 确保使用锁文件中的精确版本
      - run: pnpm type-check # vue-tsc --noEmit

  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
      - name: 安装go环境
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          # Set this option if you want the action to check for the latest available version
          # Default: false
          check-latest: false
          # # GitHub token for authentication
          # token: ${{ github.token }}
          # Used to specify whether caching is needed.
          # Default: true
          cache: true
          # Path to dependency files for caching
          cache-dependency-path: "go.sum"
          # Custom base URL for Go downloads (e.g., for mirrors)
          go-download-base-url: "https://mirrors.aliyun.com/"
      - name: 测试
        run: |
          go test -failfast
  report:
    name: 报告
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/upload-artifact@v7
