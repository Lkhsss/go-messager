name: Build Docker

run-name: 构建 Docker 镜像 · ${{ github.ref_name }}

# 推送 vX.Y.Z 形式的标签时发布镜像；也可以在 Actions 页面手动触发
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# 同一个分支/标签的构建串行执行，避免并发推送同一个镜像标签
concurrency:
  group: build-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # 默认推送到 GitHub Container Registry。
  # 使用其他仓库（Docker Hub / Gitea / 阿里云 ACR 等）时，在
  # 「仓库 → Settings → Variables」中覆盖下面三个变量，并在 Secrets 中添加
  # REGISTRY_PASSWORD（不配置时依次回退到 GITEA_TOKEN / GITHUB_TOKEN）。
  #   Docker Hub 示例：
  #     REGISTRY=docker.io
  #     IMAGE_NAME=docker.io/<用户名>/go-messager
  #     REGISTRY_USERNAME=<用户名>
  #   Gitea 示例：
  #     REGISTRY=git.lkhssssss.cn
  #     IMAGE_NAME=git.lkhssssss.cn/lkhsss/go-messager
  #     REGISTRY_USERNAME=lkhsss
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}
  REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME || github.actor }}
  # 多架构平台；只构建 amd64 可设为 linux/amd64
  # PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64' }}
  # 国内 Go 模块代理与校验数据库；可在仓库 Variables 中覆盖
  GOPROXY: ${{ vars.GOPROXY || 'https://goproxy.cn,direct' }}
  GOSUMDB: ${{ vars.GOSUMDB || 'sum.golang.google.cn' }}
  # docker.io 镜像加速地址（英文逗号分隔），CI 会依次探测，选中第一个可用的：
  #   ① 把基础镜像改写成该镜像站的地址（不依赖 BuildKit 是否读取 buildkitd.toml）
  #   ② 同时写进 buildkitd.toml 作为兜底
  # 默认第一项是当前 runner 上 dockerd 正在使用的阿里云加速地址，可按需覆盖。
  DOCKER_MIRRORS: ${{ vars.DOCKER_MIRRORS || 'docker.1ms.run' }}
  # 基础镜像；留空则由探测到的镜像站自动拼装（如 <mirror>/library/node:24-alpine），
  # 显式设置时（如 vars.NODE_IMAGE=node:24-alpine）原样使用
  NODE_IMAGE: ${{ vars.NODE_IMAGE || '' }}
  GO_IMAGE: ${{ vars.GO_IMAGE || '' }}
  RUNTIME_IMAGE: ${{ vars.RUNTIME_IMAGE || '' }}

jobs:
  test:
    name: 测试与前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 校验版本号
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::标签 ${tag} 不是 vX.Y.Z 形式的语义化版本"
            exit 1
          fi

      - name: 安装 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # 仅加速 Go 工具链下载；模块下载由 GOPROXY 控制
          go-download-base-url: ${{ vars.GO_DOWNLOAD_BASE_URL || 'https://golang.google.cn/dl' }}

      - name: 安装 pnpm 和 Node.js
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@24
          working-directory: template
          cache: true
          cache-dependency-path: template/pnpm-lock.yaml
          install: false

      - name: 安装前端依赖
        working-directory: template
        run: pnpm install --frozen-lockfile

      - name: 构建前端（含类型检查）
        working-directory: template
        run: pnpm run build

      - name: 运行 Go 测试
        run: go test ./...

  docker:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 设置 QEMU（多架构构建）
        uses: docker/setup-qemu-action@v4

      - name: 探测 docker.io 镜像加速并生成 BuildKit 配置
        id: mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .buildx
          prefix=""
          reachable=()
          if [[ -n "${DOCKER_MIRRORS:-}" ]]; then
            IFS=',' read -ra list <<< "${DOCKER_MIRRORS}"
            for mirror in "${list[@]}"; do
              mirror="$(printf '%s' "${mirror}" | tr -d '[:space:]')"
              if [[ -z "${mirror}" ]]; then
                continue
              fi
              code="$(curl -sS -m 5 -o /dev/null -w '%{http_code}' "https://${mirror}/v2/" || true)"
              echo "镜像站 ${mirror}/v2/ -> HTTP ${code:-连接失败}"
              if [[ "${code}" == "200" || "${code}" == "401" ]]; then
                reachable+=("${mirror}")
                if [[ -z "${prefix}" ]]; then
                  prefix="${mirror}/library/"
                fi
              fi
            done
          fi

          {
            echo "# 由 CI 自动生成：docker.io 镜像加速（可用仓库变量 DOCKER_MIRRORS 覆盖）"
            if [[ "${#reachable[@]}" -gt 0 ]]; then
              mirrors_toml=""
              for mirror in "${reachable[@]}"; do
                mirrors_toml="${mirrors_toml:+${mirrors_toml}, }\"${mirror}\""
              done
              printf '[registry."docker.io"]\n  mirrors = [%s]\n' "${mirrors_toml}"
            fi
          } > .buildx/buildkitd.toml

          node_image="${NODE_IMAGE:-${prefix}node:24-alpine}"
          go_image="${GO_IMAGE:-${prefix}golang:1.27-alpine}"
          runtime_image="${RUNTIME_IMAGE:-${prefix}alpine:3.22}"
          {
            echo "node_image=${node_image}"
            echo "go_image=${go_image}"
            echo "runtime_image=${runtime_image}"
          } >> "${GITHUB_OUTPUT}"

          echo "BuildKit 配置："
          cat .buildx/buildkitd.toml
          echo "构建使用的基础镜像："
          echo "  NODE_IMAGE=${node_image}"
          echo "  GO_IMAGE=${go_image}"
          echo "  RUNTIME_IMAGE=${runtime_image}"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # 让 BuildKit 自己拉取基础镜像时也走上面的镜像加速配置
          config: .buildx/buildkitd.toml

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=go-messager
            org.opencontainers.image.description=Go 语言论坛
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=${{ env.GOPROXY }}
            GOSUMDB=${{ env.GOSUMDB }}
            NODE_IMAGE=${{ steps.mirror.outputs.node_image }}
            GO_IMAGE=${{ steps.mirror.outputs.go_image }}
            RUNTIME_IMAGE=${{ steps.mirror.outputs.runtime_image }}
          pull: true
          # 部分自建 registry 不支持 OCI attestation，关闭 provenance 以保证兼容
          provenance: false
          # 用镜像仓库保存 BuildKit 缓存，GitHub / Gitea / Docker Hub 都可用
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
