name: Build Docker

run-name: 构建 Docker 镜像 · ${{ github.ref_name }}

# 推送 vX.Y.Z 形式的标签时发布镜像；也可以在 Actions 页面手动触发
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# 同一个分支/标签的构建串行执行，避免并发推送同一个镜像标签
concurrency:
  group: build-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # 默认推送到 GitHub Container Registry。
  # 使用其他仓库（Docker Hub / Gitea / 阿里云 ACR 等）时，在
  # 「仓库 → Settings → Variables」中覆盖下面三个变量，并在 Secrets 中添加
  # REGISTRY_PASSWORD（不配置时依次回退到 GITEA_TOKEN / GITHUB_TOKEN）。
  #   Docker Hub 示例：
  #     REGISTRY=docker.io
  #     IMAGE_NAME=docker.io/<用户名>/go-messager
  #     REGISTRY_USERNAME=<用户名>
  #   Gitea 示例：
  #     REGISTRY=git.lkhssssss.cn
  #     IMAGE_NAME=git.lkhssssss.cn/lkhsss/go-messager
  #     REGISTRY_USERNAME=lkhsss
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}
  REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME || github.actor }}
  # 只使用 runner 本机架构构建（不做跨架构，因此不需要 QEMU）
  # Docker 构建层缓存的后端：
  #   registry（默认）—— 缓存推到镜像仓库的独立标签，Gitea / GHCR / 自建 registry 都能用
  #   gha            —— 走 Actions 缓存 API，需要 runner 提供缓存服务（见 README「CI 缓存」）
  DOCKER_CACHE_TYPE: ${{ vars.DOCKER_CACHE_TYPE || 'registry' }}
  # registry 模式下是缓存标签名（<镜像>:<值>），gha 模式下是缓存作用域名
  DOCKER_CACHE_REF: ${{ vars.DOCKER_CACHE_REF || 'buildcache' }}
  # 国内 Go 模块代理与校验数据库；可在仓库 Variables 中覆盖
  GOPROXY: ${{ vars.GOPROXY || 'https://goproxy.cn,direct' }}
  GOSUMDB: ${{ vars.GOSUMDB || 'sum.golang.google.cn' }}
  # 前端依赖镜像源（npm / pnpm），默认走 npmmirror；
  # 换官方源就设 vars.NPM_REGISTRY=https://registry.npmjs.org
  NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmmirror.com' }}
  # docker.io 镜像加速地址（英文逗号分隔）：CI 依次探测，第一个可用的用于改写基础镜像地址
  # 默认只用 docker.1ms.run；可覆盖成多个地址（如 a.example,b.example）按顺序探测。
  DOCKER_MIRRORS: ${{ vars.DOCKER_MIRRORS || 'docker.1ms.run' }}
  # 基础镜像；留空则由探测到的镜像站自动拼装（如 <mirror>/library/node:24-alpine），
  # 显式设置时（如 vars.NODE_IMAGE=node:24-alpine）原样使用
  NODE_IMAGE: ${{ vars.NODE_IMAGE || '' }}
  GO_IMAGE: ${{ vars.GO_IMAGE || '' }}
  RUNTIME_IMAGE: ${{ vars.RUNTIME_IMAGE || '' }}

jobs:
  test:
    name: 测试与前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 校验版本号
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::标签 ${tag} 不是 vX.Y.Z 形式的语义化版本"
            exit 1
          fi

      - name: 安装 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # 开启内置缓存：同时缓存 GOMODCACHE（依赖）与 GOCACHE（编译产物）
          cache: true
          # 用 go.sum 参与缓存 key，避免 go.mod 未变但校验/间接依赖变化时误命中
          cache-dependency-path: go.sum
          # 仅加速 Go 工具链下载；模块下载由 GOPROXY 控制
          go-download-base-url: ${{ vars.GO_DOWNLOAD_BASE_URL || 'https://golang.google.cn/dl' }}

      - name: 安装 pnpm 和 Node.js
        uses: pnpm/setup@v3
        env:
          # 这个 action 会从 npm registry 下载 pnpm 本体，这两个前缀一起给上：
          # npm 读 npm_config_registry，pnpm 11+ 读 pnpm_config_registry
          npm_config_registry: ${{ env.NPM_REGISTRY }}
          pnpm_config_registry: ${{ env.NPM_REGISTRY }}
        with:
          version: 11
          runtime: node@24
          working-directory: template
          cache: true
          cache-dependency-path: template/pnpm-lock.yaml
          install: false

      - name: 显示缓存目录（便于确认缓存是否命中）
        shell: bash
        run: |
          echo "NPM_REGISTRY=${NPM_REGISTRY}"
          echo "GOMODCACHE=$(go env GOMODCACHE)"
          echo "GOCACHE=$(go env GOCACHE)"
          du -sh "$(go env GOMODCACHE)" "$(go env GOCACHE)" 2>/dev/null || true
          store="$(cd template && pnpm store path)"
          echo "PNPM_STORE=${store}"
          du -sh "${store}" 2>/dev/null || true

      - name: 安装前端依赖
        working-directory: template
        env:
          # npm 读 npm_config_registry，pnpm 11+ 读 pnpm_config_registry；
          # 下面再用 --registry 显式指定，避免本地 .npmrc 覆盖镜像源
          npm_config_registry: ${{ env.NPM_REGISTRY }}
          pnpm_config_registry: ${{ env.NPM_REGISTRY }}
        # --prefer-offline：缓存命中时不再向 registry 校验，冷缓存会自动回退到联网下载
        run: pnpm install --frozen-lockfile --prefer-offline --registry "${NPM_REGISTRY}"

      - name: 构建前端（含类型检查）
        working-directory: template
        run: pnpm run build

      - name: 运行 Go 测试
        run: go test ./...

  docker:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 探测 docker.io 镜像加速
        id: mirror
        shell: bash
        run: |
          set -euo pipefail
          prefix=""
          if [[ -n "${DOCKER_MIRRORS:-}" ]]; then
            IFS=',' read -ra list <<< "${DOCKER_MIRRORS}"
            for mirror in "${list[@]}"; do
              mirror="$(printf '%s' "${mirror}" | tr -d '[:space:]')"
              if [[ -z "${mirror}" ]]; then
                continue
              fi
              code="$(curl -sS -m 5 -o /dev/null -w '%{http_code}' "https://${mirror}/v2/" || true)"
              echo "镜像站 ${mirror}/v2/ -> HTTP ${code:-连接失败}"
              if [[ "${code}" == "200" || "${code}" == "401" ]]; then
                prefix="${mirror}/library/"
                break
              fi
            done
          fi

          node_image="${NODE_IMAGE:-${prefix}node:24-alpine}"
          go_image="${GO_IMAGE:-${prefix}golang:1.27-alpine}"
          runtime_image="${RUNTIME_IMAGE:-${prefix}alpine:3.22}"
          {
            echo "node_image=${node_image}"
            echo "go_image=${go_image}"
            echo "runtime_image=${runtime_image}"
          } >> "${GITHUB_OUTPUT}"

          echo "构建使用的基础镜像（按 runner 本机架构构建）："
          echo "  NODE_IMAGE=${node_image}"
          echo "  GO_IMAGE=${go_image}"
          echo "  RUNTIME_IMAGE=${runtime_image}"

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=go-messager
            org.opencontainers.image.description=Go 语言论坛
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}

      - name: 计算构建缓存配置
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          # registry：缓存是可拉取的镜像标签，跨 runner、跨机器都能命中
          # gha：缓存存到 Actions 缓存服务，省一个 tag，但要求 runner 提供缓存服务
          if [[ "${DOCKER_CACHE_TYPE}" == "gha" ]]; then
            from="type=gha,scope=${DOCKER_CACHE_REF}"
            to="type=gha,scope=${DOCKER_CACHE_REF},mode=max"
          else
            ref="${IMAGE_NAME}:${DOCKER_CACHE_REF}"
            from="type=registry,ref=${ref}"
            to="type=registry,ref=${ref},mode=max"
          fi
          echo "from=${from}" >> "${GITHUB_OUTPUT}"
          echo "to=${to}" >> "${GITHUB_OUTPUT}"
          echo "cache-from: ${from}"
          echo "cache-to: ${to}"

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # 不指定 platforms：直接用 runner 上 Docker 引擎自带的 builder 构建本机架构
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=${{ env.GOPROXY }}
            GOSUMDB=${{ env.GOSUMDB }}
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
            NODE_IMAGE=${{ steps.mirror.outputs.node_image }}
            GO_IMAGE=${{ steps.mirror.outputs.go_image }}
            RUNTIME_IMAGE=${{ steps.mirror.outputs.runtime_image }}
          pull: true
          # mode=max：连未被最终镜像引用的中间层（如 pnpm install、go mod download）
          # 也一起导出，Dockerfile 里这些耗时步骤下次才能直接命中
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
