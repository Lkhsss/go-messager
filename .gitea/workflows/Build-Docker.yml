name: Build Docker

run-name: 构建 Docker 镜像 · ${{ github.ref_name }}

# 推送 vX.Y.Z 形式的标签时发布版本标签和 latest；手动触发只发布 latest。
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# 同一个分支/标签的构建串行执行，避免并发推送同一个镜像标签
concurrency:
  group: build-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # 默认 ghcr.io，可在仓库 Variables 覆盖 REGISTRY / IMAGE_NAME / REGISTRY_USERNAME。
  # 其他仓库需在 Secrets 配置 REGISTRY_PASSWORD（缺省回退 GITEA_TOKEN / GITHUB_TOKEN）。
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}
  REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME || github.actor }}
  # Go 代理和校验库。
  GOPROXY: ${{ vars.GOPROXY || 'https://goproxy.cn,direct' }}
  GOSUMDB: ${{ vars.GOSUMDB || 'sum.golang.google.cn' }}
  # 前端依赖镜像源。
  NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmmirror.com' }}

jobs:
  docker:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # 标签触发：推送版本标签（如 0.5.0）和 latest；手动触发：只推送 latest。
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          # 不指定 platforms，构建 runner 本机架构。
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=${{ env.GOPROXY }}
            GOSUMDB=${{ env.GOSUMDB }}
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
