; go-messager 完整配置示例
; 复制为 conf/app.ini 后生效
;
; 环境变量优先级：
;   GIN_MODE    > [server] mode
;   JWT_SECRET  > [jwt] secret > 数据库自动生成
;   JWT_TTL     > [jwt] ttl    > 24h

[server]
; 留空时 debug 监听 127.0.0.1，其他模式监听 0.0.0.0
host =
; 1-65535
port = 8080
; debug / release / test，留空默认 release；GIN_MODE 优先
mode = release
; 反向代理地址或网段，逗号分隔；留空表示不信任 X-Forwarded-For（直连部署保持留空）
trusted_proxies =

[access]
; private（默认）：所有页面和操作必须登录
; public：游客可浏览文章，写文章/互动/评论时跳转登录
mode = private

[database]
; 相对进程工作目录，目录不存在会自动创建
path = ./data/data.db
; 写锁等待时间，默认 5s
busy_timeout = 5s
; 连接池上限，SQLite 建议 1（串行写，彻底避免 database is locked）
max_open_conns = 1

[jwt]
; 建议用 JWT_SECRET 环境变量注入，不要提交真实密钥
secret =
; 不活跃容忍时长：期间访问过站点会自动续期；例如 30m、12h、24h、168h（7 天）
ttl = 24h

[captcha]
; 注册人机验证：true（默认）开启，false 关闭
; 开启后新用户注册前需在独立页面完成图形验证码校验
enabled = true

[register]
; 注册开关：true（默认）允许自助注册，false 关闭
; 关闭后仅保留全新库的首个管理员初始化，其余注册返回 403；修改后需重启
enabled = true

[limits]
; 防刷与内容治理。默认值针对小型论坛，可按需调整。
; 所有用户的每分钟写入上限
post_per_minute = 5
comment_per_minute = 10
reaction_per_minute = 30

; 注册不足该时长且未标记可信的账号使用更严格的每日配额
new_account_hours = 24h
new_account_post_per_day = 5
new_account_comment_per_day = 20

; 普通老用户/可信用户的每日上限
post_per_day = 200
comment_per_day = 500

; 同一 IP 的成功注册次数上限
register_per_ip_per_hour = 10
register_per_ip_per_day = 20

; 注册与修改密码时的约束
min_password_bytes = 8
min_username_runes = 2
max_username_runes = 32

; 同一用户相同正文（忽略空白）的去重窗口
duplicate_window = 24h
