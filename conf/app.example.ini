; ===========================================================================
; go-messager 配置示例
;
; 使用方法：
;   Linux/macOS: cp conf/app.example.ini conf/app.ini
;   Windows:     Copy-Item conf/app.example.ini conf/app.ini
;
; 环境变量优先级（仅 Gin 模式和 JWT 相关配置）：
;   GIN_MODE    > [server] mode
;   JWT_SECRET  > [jwt] secret > 数据库自动生成
;   JWT_TTL     > [jwt] ttl    > 24h
; ===========================================================================

[server]
; 监听地址。
; 留空时：debug 模式监听 127.0.0.1（避免本地防火墙提示），
;         release 模式监听 0.0.0.0（容器/公网可访问）。
host =
; HTTP 监听端口，范围 1-65535。
port = 8080
; Gin 运行模式：debug / release / test。
; 留空时使用 GIN_MODE 环境变量；都没有时 Gin 默认 debug。
mode =

[database]
; SQLite 数据库文件路径，相对进程工作目录。
; 目录不存在时会自动创建，默认数据库为 ./data/data.db。
path = ./data/data.db

[jwt]
; JWT 签名密钥。生产环境建议通过 JWT_SECRET 环境变量注入，
; 不要在本文件或版本库中保存真实密钥。
; 留空时依次使用 JWT_SECRET 环境变量、数据库 settings 表中自动生成的密钥。
secret =
; token 有效期，使用 Go duration 语法（例如 30m、12h、24h，不支持 "7d"）。
; JWT_TTL 环境变量优先于本配置。
ttl = 24h
