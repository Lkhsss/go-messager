; go-messager 完整配置示例
; 复制为 conf/app.ini 后生效
;
; 环境变量优先级：
;   GIN_MODE    > [server] mode
;   JWT_SECRET  > [jwt] secret > 数据库自动生成
;   JWT_TTL     > [jwt] ttl    > 24h

[server]
; 留空时 debug 监听 127.0.0.1，其他模式监听 0.0.0.0
host =
; 1-65535
port = 8080
; debug / release / test，留空默认 release；GIN_MODE 优先
mode = release

[database]
; 相对进程工作目录，目录不存在会自动创建
path = ./data/data.db

[jwt]
; 建议用 JWT_SECRET 环境变量注入，不要提交真实密钥
secret =
; Go duration，例如 30m、12h、24h
ttl = 24h
