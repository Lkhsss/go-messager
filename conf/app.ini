; go-messager 配置文件
; 注意：不要把真实密钥提交到版本库，生产环境建议使用 JWT_SECRET 环境变量

[server]
; 监听地址。留空时：debug 模式监听 127.0.0.1，release 模式监听 0.0.0.0
host =
; HTTP 监听端口
port = 8080
; Gin 运行模式：debug / release / test
; 留空时沿用 GIN_MODE 环境变量；未设置则为 Gin 默认的 debug
mode = release

[database]
; SQLite 数据库文件路径，相对进程工作目录
; 父目录不存在会自动创建，默认存放到 ./data 目录
path = ./data/data.db

[jwt]
; JWT 签名密钥。留空时依次使用 JWT_SECRET 环境变量、数据库 settings 表中自动生成的密钥
secret =
; token 有效期，Go duration 语法，例如 24h、30m；JWT_TTL 环境变量优先
ttl = 24h
